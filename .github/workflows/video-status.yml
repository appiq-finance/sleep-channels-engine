name: Check video status
on:
  push:
    paths: ["checks/status-request*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: pip install -q google-api-python-client google-auth
      - name: Ask YouTube for the status of every uploaded video (public info only is saved)
        env:
          CID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          CSEC: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          T_stormwood: ${{ secrets.YOUTUBE_REFRESH_TOKEN_STORMWOOD }}
          T_valley: ${{ secrets.YOUTUBE_REFRESH_TOKEN_VALLEY }}
        run: |
          python3 - <<'PY'
          import json, glob, os, re, datetime
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          out = {"checked_at": datetime.datetime.utcnow().isoformat() + "Z", "channels": {}, "videos": {}}
          ids = {}
          for f in glob.glob("done/*.json"):
              d = json.load(open(f)); m = re.search(r"youtu\.be/([\w-]{11})", d.get("url", ""))
              if m: ids.setdefault("valley" if "-valley-" in f else "stormwood", []).append((os.path.basename(f), m.group(1)))
          for ch in ("stormwood", "valley"):
              try:
                  cr = Credentials(None, refresh_token=os.environ["T_" + ch], token_uri="https://oauth2.googleapis.com/token",
                                   client_id=os.environ["CID"], client_secret=os.environ["CSEC"])
                  yt = build("youtube", "v3", credentials=cr, cache_discovery=False)
                  c = yt.channels().list(part="id,snippet,status,statistics", mine=True).execute()["items"][0]
                  out["channels"][ch] = {"id": c["id"], "title": c["snippet"]["title"], "status": c.get("status"),
                                         "statistics": c.get("statistics")}
                  # every upload on the channel (includes test uploads, private and removed ones the owner can still see)
                  up = "UU" + c["id"][2:]; seen = []
                  req = yt.playlistItems().list(part="snippet,status,contentDetails", playlistId=up, maxResults=50)
                  while req is not None:
                      r = req.execute()
                      seen += [{"id": i["contentDetails"]["videoId"], "title": i["snippet"]["title"],
                                "privacy": i.get("status", {}).get("privacyStatus")} for i in r.get("items", [])]
                      req = yt.playlistItems().list_next(req, r)
                  out["channels"][ch]["uploads_seen"] = seen
                  want = [v for _, v in ids.get(ch, [])] + [s["id"] for s in seen]
                  want = list(dict.fromkeys(want))
                  for k in range(0, len(want), 50):
                      r = yt.videos().list(part="status,snippet,processingDetails,statistics,contentDetails",
                                           id=",".join(want[k:k + 50])).execute()
                      got = {v["id"]: v for v in r.get("items", [])}
                      for vid in want[k:k + 50]:
                          v = got.get(vid)
                          out["videos"][vid] = {"channel": ch, "found": bool(v)} if not v else {
                              "channel": ch, "title": v["snippet"]["title"], "status": v["status"],
                              "processing": v.get("processingDetails", {}).get("processingStatus"),
                              "duration": v["contentDetails"].get("duration"), "statistics": v.get("statistics")}
              except Exception as e:
                  out["channels"][ch] = {"error": f"{type(e).__name__}: {str(e)[:300]}"}
          json.dump(out, open("checks/video_status.json", "w"), indent=1)
          print(json.dumps(out, indent=1)[:20000])
          PY
      - name: Save result
        run: |
          git config user.name "sleep-channels-bot"; git config user.email "bot@users.noreply.github.com"
          git add checks/video_status.json; git diff --cached --quiet && exit 0
          git commit -qm "Video status check"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done
